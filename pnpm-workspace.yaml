# pnpm settings for this repo. It is a single package, not a workspace: there
# is no `packages:` list, and examples/sample-plugin keeps its own npm install.

# Install only versions published at least a day ago (in minutes), so a
# compromised release has time to be caught and pulled before it lands here.
minimumReleaseAge: 1440

# Our own packages are published and consumed across repos on the same day, so
# the one-day release delay must not hold them back.
minimumReleaseAgeExclude:
  - '@datum-cloud/*'

# Refuse a version published with weaker provenance than an earlier one, the
# usual sign of a hijacked publish.
trustPolicy: no-downgrade

# @mjackson/headers published with provenance up to 0.6.1 and without it
# since, so every later version reads as a downgrade. remix-auth-oauth2 3.4.1,
# its latest release, still needs ^0.10.0. Exempt that one version only.
trustPolicyExclude:
  - '@mjackson/headers@0.10.0'

# Only scripts a local install needs: lefthook installs the git hooks, cypress
# fetches its binary, esbuild and @sentry/cli check their platform binaries.
# CI and the image install with --ignore-scripts and fetch Cypress themselves.
allowBuilds:
  '@sentry/cli': true
  cypress: true
  esbuild: true
  fsevents: false
  lefthook: true
  protobufjs: false

# Versions that overrides must agree with. package.json takes them with
# `catalog:` so each is written once.
catalog:
  '@hono/node-server': ^2.1.9
  eslint: ^10.8.1
  monaco-editor: ^0.56.0

overrides:
  axios: ^1.19.0
  form-data: ^4.0.4
  dompurify: ^3.4.17
  '@hono/node-server': 'catalog:'
  picomatch: ^4.0.0
  graphql: 17.0.2
  qs: ^6.17.1
  tinypool: ^2.1.2
  brace-expansion@2: ^2.1.7
  # trustPolicy: semver 6.3.1 shipped without provenance after 7.5.1 had it,
  # so it reads as a downgrade. 6.3.2 is published with provenance.
  semver@6: ^6.3.2
  # GHSA-rj75-hqrm-r3gf: @tailwindcss/typography pins 6.0.10 exactly and its
  # latest release has not moved, so floor the version here.
  postcss-selector-parser@<6.1.5: ^6.1.5
  '@graphql-tools/utils': ^12.0.2
  # GHSA-g3hv-75wg-m249: glob 13 bundles minimatch 10, so both move.
  minimatch: 11.0.4
  glob: 14.0.3
  # react-router-hono-server's peer floor; npm never enforced it.
  ws@^8: ^8.21.3
  '@hey-api/json-schema-ref-parser>js-yaml': ^4.3.2
  '@datum-cloud/activity-ui>monaco-editor': 'catalog:'
  eslint-plugin-jsx-a11y>eslint: 'catalog:'
  eslint-plugin-react>eslint: 'catalog:'
