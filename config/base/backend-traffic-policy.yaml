apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: cloud-portal
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: cloud-portal
  # Envoy Gateway drops a compressor whose settings block is missing, even
  # an empty one, while still reporting the policy as Accepted.
  compressor:
    - type: Brotli
      brotli: {}
    - type: Gzip
      gzip: {}
  # Retry only failures where the request never reached the portal. `reset`
  # is left out on purpose: it would also retry a POST the portal had already
  # started handling when its pod died, which can submit it twice.
  retry:
    numRetries: 2
    perRetry:
      backOff:
        baseInterval: 100ms
        maxInterval: 1s
    retryOn:
      triggers:
        - connect-failure
        - refused-stream
  tcpKeepalive:
    idleTime: 60s
    interval: 15s
    probes: 3
  timeout:
    http:
      requestTimeout: "0s"
      # Must stay below the portal's keep-alive timeout (75s, in
      # app/server/entry.ts) so Envoy closes idle upstream connections
      # before the portal does.
      connectionIdleTimeout: 60s
