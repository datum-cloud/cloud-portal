apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: cloud-portal
    app.kubernetes.io/name: cloud-portal
    app.kubernetes.io/version: 1.0.0
  name: cloud-portal
spec:
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
      app.kubernetes.io/instance: cloud-portal
      app.kubernetes.io/name: cloud-portal
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: frontend
        app.kubernetes.io/instance: cloud-portal
        app.kubernetes.io/name: cloud-portal
    spec:
      # Matches the datum user (uid/gid 1001) the Dockerfile switches to.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloud-portal
          # CI stamps the release tag over this at bundle publish time
          # (kustomize edit set image in config/base).
          image: ghcr.io/datum-cloud/cloud-portal:v0.15.0
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: OTEL_LOG_LEVEL
              value: 'info'
            - name: OTEL_ENABLED
              value: 'true'
            - name: API_URL
              value: https://api.datum.net
            - name: APP_URL
              value: https://cloud.datum.net
            - name: TELEMETRY_URL
              value: https://loki-single-binary.telemetry-system.svc.cluster.local:3100
            - name: PROMETHEUS_URL
              value: http://vmsingle-datum-resource-metrics.datum-system.svc.cluster.local:8429
            - name: SENTRY_DSN
              value: https://5577e0a8a54d023d2c51092ee68041b3@sentry.prod.env.datum.net/5
          envFrom:
            - secretRef:
                name: cloud-portal
          resources:
            # TODO: Specify resource requests
            limits:
              cpu: 1
              memory: 1Gi
          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 10
            httpGet:
              path: /_healthz
              port: 3000
              scheme: HTTP
          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 10
            httpGet:
              path: /_readyz
              port: 3000
              scheme: HTTP
          volumeMounts:
            # Bun's transpiler cache (BUN_RUNTIME_TRANSPILER_CACHE_PATH in the
            # Dockerfile) and any other temp files; the root filesystem is
            # read-only.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
