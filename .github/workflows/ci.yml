name: CI

on:
  pull_request:
  release:
    types: ['published']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CYPRESS_CACHE_FOLDER: ~/.cache/Cypress
  BUN_CACHE: ~/.bun/install/cache

jobs:
  # ─── Quality ────────────────────────────────────────────────
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    outputs:
      # "false" only when every changed file is documentation or tooling
      # metadata; the test jobs skip on that. Anything else, including an
      # empty diff or a non-PR event, runs the full suite.
      app: ${{ steps.changes.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.4.2 } # renovate: datasource=docker depName=oven/bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: cache-deps
        with:
          path: |
            ${{ env.BUN_CACHE }}
            ${{ env.CYPRESS_CACHE_FOLDER }}
            **/node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('**/bun.lock', '**/bun.lockb', '**/package.json') }}
      - if: steps.cache-deps.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile
      # The cache is saved by this job only, so the Cypress binary has to be
      # fetched here or every Cypress job downloads it again on every run.
      - if: steps.cache-deps.outputs.cache-hit != 'true'
        run: bunx cypress install
      - name: Detect app changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail open: if the base cannot be fetched, run everything.
          if ! git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          app=$(printf '%s\n' "$changed" | grep -vE '^(docs/|\.claude/|graphify-out/)|\.md$' || true)
          if [[ -z "$changed" || -n "$app" ]]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only documentation changed; test jobs will be skipped."
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint & Format
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ env.BUN_CACHE }}
            ${{ env.CYPRESS_CACHE_FOLDER }}
            **/node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('**/bun.lock', '**/bun.lockb', '**/package.json') }}
      - run: bun run lint && bun run format

  typecheck:
    name: Type Check
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.4.2 } # renovate: datasource=docker depName=oven/bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ env.BUN_CACHE }}
            ${{ env.CYPRESS_CACHE_FOLDER }}
            **/node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('**/bun.lock', '**/bun.lockb', '**/package.json') }}
      - run: bun typecheck

  build:
    name: Build
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    if: ${{ !failure() && !cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.4.2 } # renovate: datasource=docker depName=oven/bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ env.BUN_CACHE }}
            ${{ env.CYPRESS_CACHE_FOLDER }}
            **/node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('**/bun.lock', '**/bun.lockb', '**/package.json') }}
      - run: bun run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-${{ github.sha }}
          path: build
          retention-days: 1

  # ─── Tests ──────────────────────────────────────────────────
  bun-tests:
    name: Bun Unit Tests
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.4.2 } # renovate: datasource=docker depName=oven/bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ env.BUN_CACHE }}
            ${{ env.CYPRESS_CACHE_FOLDER }}
            **/node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('**/bun.lock', '**/bun.lockb', '**/package.json') }}
      # Coverage is reported (text in the log + lcov artifact) but not gated yet.
      # Bun only instruments files imported by tests, so the % reflects the
      # unit-tested surface, not the whole repo.
      - run: bun run test:coverage
        env:
          NODE_ENV: test
          AUTH_OIDC_ISSUER: ${{ secrets.AUTH_OIDC_ISSUER }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bun-coverage-${{ github.run_id }}
          path: coverage/lcov.info
          retention-days: 7
          if-no-files-found: warn

  unit-tests:
    name: Unit Tests
    needs: [install, build]
    runs-on: ubuntu-latest
    if: ${{ !failure() && !cancelled() && needs.install.outputs.app == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.4.2 } # renovate: datasource=docker depName=oven/bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ env.BUN_CACHE }}
            ${{ env.CYPRESS_CACHE_FOLDER }}
            **/node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('**/bun.lock', '**/bun.lockb', '**/package.json') }}
      - run: bunx cypress install && bunx cypress verify
      - run: bun run test:unit:prod
        env:
          NODE_ENV: test
          CYPRESS: 'true'

  e2e-smoke:
    name: E2E Smoke
    needs: [install, build]
    runs-on: ubuntu-latest
    # Two attempts of ~5 minutes each must fit, plus setup.
    timeout-minutes: 15
    if: ${{ !failure() && !cancelled() && needs.install.outputs.app == 'true' }}
    env:
      NODE_ENV: test
      CYPRESS: 'true'
      CYPRESS_BASE_URL: http://localhost:3000
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      SUB: ${{ secrets.SUB }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.4.2 } # renovate: datasource=docker depName=oven/bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ env.BUN_CACHE }}
            ${{ env.CYPRESS_CACHE_FOLDER }}
            **/node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('**/bun.lock', '**/bun.lockb', '**/package.json') }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-${{ github.sha }}
          path: build
      - name: Setup Environment
        env:
          API_URL: ${{ secrets.API_URL }}
          GRAPHQL_URL: ${{ secrets.GRAPHQL_URL }}
          AUTH_OIDC_ISSUER: ${{ secrets.AUTH_OIDC_ISSUER }}
          AUTH_OIDC_CLIENT_ID: ${{ secrets.AUTH_OIDC_CLIENT_ID }}
        run: |
          cat > .env << EOF
          NODE_ENV=test
          CYPRESS=true
          APP_URL=http://localhost:3000
          API_URL=$API_URL
          GRAPHQL_URL=$GRAPHQL_URL
          AUTH_OIDC_ISSUER=$AUTH_OIDC_ISSUER
          AUTH_OIDC_CLIENT_ID=$AUTH_OIDC_CLIENT_ID
          SESSION_SECRET=$SESSION_SECRET
          LOG_LEVEL=warn
          CYPRESS_BASE_URL=http://localhost:3000
          EOF
      - run: bunx cypress install && bunx cypress verify
      # First attempt records no video: green runs are the common case and
      # encoding plus upload is a real share of the job. A failure here does
      # not fail the job yet; the retry below decides.
      - name: Run Smoke Tests
        id: e2e
        continue-on-error: true
        env:
          CYPRESS_video: 'false'
        run: >-
          bunx start-server-and-test
          'bun run start' http://localhost:3000/_healthz
          'bunx cypress run --spec "cypress/e2e/smoke/**" --config-file cypress.config.ts'
      # One retry of the whole job, with video on, replaces the habit of
      # re-running the entire workflow (~26 job-minutes) to clear a flake.
      - name: Retry Smoke Tests
        id: e2e-retry
        if: steps.e2e.outcome == 'failure'
        env:
          CYPRESS_video: 'true'
        run: >-
          bunx start-server-and-test
          'bun run start' http://localhost:3000/_healthz
          'bunx cypress run --spec "cypress/e2e/smoke/**" --config-file cypress.config.ts'
      - if: steps.e2e.outcome == 'failure' && steps.e2e-retry.outcome == 'success'
        run: echo "::warning title=E2E passed on retry::Smoke failed once and passed on retry. Treat as flaky, not green."
      - if: failure() || steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-smoke-artifacts-${{ github.run_id }}
          path: |
            cypress/videos
            cypress/screenshots
          retention-days: 7
          if-no-files-found: warn

  e2e-regression:
    name: E2E Regression
    needs: [install, e2e-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ !failure() && !cancelled() && needs.install.outputs.app == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      NODE_ENV: test
      CYPRESS: 'true'
      CYPRESS_BASE_URL: http://localhost:3000
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      SUB: ${{ secrets.SUB }}
      SPLIT: ${{ strategy.job-total }}
      SPLIT_INDEX: ${{ strategy.job-index }}
      CYPRESS_specPattern: 'cypress/e2e/regression/**/*.{cy,spec}.{js,jsx,ts,tsx}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.4.2 } # renovate: datasource=docker depName=oven/bun
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ env.BUN_CACHE }}
            ${{ env.CYPRESS_CACHE_FOLDER }}
            **/node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('**/bun.lock', '**/bun.lockb', '**/package.json') }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-${{ github.sha }}
          path: build
      - name: Setup Environment
        env:
          API_URL: ${{ secrets.API_URL }}
          GRAPHQL_URL: ${{ secrets.GRAPHQL_URL }}
          AUTH_OIDC_ISSUER: ${{ secrets.AUTH_OIDC_ISSUER }}
          AUTH_OIDC_CLIENT_ID: ${{ secrets.AUTH_OIDC_CLIENT_ID }}
        run: |
          cat > .env << EOF
          NODE_ENV=test
          CYPRESS=true
          APP_URL=http://localhost:3000
          API_URL=$API_URL
          GRAPHQL_URL=$GRAPHQL_URL
          AUTH_OIDC_ISSUER=$AUTH_OIDC_ISSUER
          AUTH_OIDC_CLIENT_ID=$AUTH_OIDC_CLIENT_ID
          SESSION_SECRET=$SESSION_SECRET
          LOG_LEVEL=warn
          CYPRESS_BASE_URL=http://localhost:3000
          EOF
      - run: bunx cypress install && bunx cypress verify
      # First attempt records no video; see the smoke job for the reasoning.
      - name: Run Regression Tests
        id: e2e
        continue-on-error: true
        env:
          CYPRESS_video: 'false'
        run: >-
          bunx start-server-and-test
          'bun run start' http://localhost:3000/_healthz
          'bunx cypress run --config-file cypress.config.ts'
      # The retry runs the same shard once more, with video on. A shard that
      # fails twice fails the job; one that passes here is reported as flaky
      # by the PR summary, not silently counted as green.
      - name: Retry Regression Tests
        id: e2e-retry
        if: steps.e2e.outcome == 'failure'
        env:
          CYPRESS_video: 'true'
        run: >-
          bunx start-server-and-test
          'bun run start' http://localhost:3000/_healthz
          'bunx cypress run --config-file cypress.config.ts'
      - if: steps.e2e.outcome == 'failure' && steps.e2e-retry.outcome == 'success'
        run: echo "::warning title=E2E passed on retry::Regression shard ${{ matrix.shard }} failed once and passed on retry. Treat as flaky, not green."
      - if: failure() || steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-regression-artifacts-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: |
            cypress/videos
            cypress/screenshots
          retention-days: 7
          if-no-files-found: warn

  # ─── Status Gate ────────────────────────────────────────────
  status-check:
    name: Final Status Check
    needs: [install, lint, typecheck, build, bun-tests, unit-tests, e2e-smoke, e2e-regression]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check Workflow Status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ One or more jobs failed"
            exit 1
          elif [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "⚠️ One or more jobs were cancelled"
            exit 1
          else
            echo "✅ All jobs passed"
          fi

  # ─── Publish (only after all checks pass) ──────────────────
  # Releases always publish. A pull request publishes only when it carries the
  # `publish-image` label, which is how a branch gets pinned into staging for
  # testing; every other PR run skips the ~5 minutes of image build and push.
  # Add the label, then push or re-run, to get the image.
  publish-container-image:
    name: Publish Container Image
    needs: [status-check]
    if: >-
      ${{ !failure() && !cancelled() &&
          (github.event_name == 'release' ||
           contains(github.event.pull_request.labels.*.name, 'publish-image')) }}
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@2dbca23d057e20ff1aab144b94a06d09ea75e5f6 # v1.21.0
    with:
      image-name: cloud-portal
    # NOTE: `secrets: inherit` is required because the upstream workflow
    # references `secrets.SENTRY_AUTH_TOKEN` without declaring it under
    # `workflow_call.secrets`. Once upstream declares it, switch to an
    # explicit `secrets:` block passing only SENTRY_AUTH_TOKEN.
    secrets: inherit

  publish-kustomize-bundles:
    name: Publish Kustomize Bundles
    needs: [publish-container-image]
    # The bundle references the image, so it follows the image job exactly,
    # including when that job was skipped by the label gate above.
    if: ${{ needs.publish-container-image.result == 'success' }}
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-kustomize-bundle.yaml@2dbca23d057e20ff1aab144b94a06d09ea75e5f6 # v1.21.0
    with:
      bundle-name: ghcr.io/datum-cloud/cloud-portal-kustomize
      bundle-path: config
      image-overlays: config/base
      image-name: ghcr.io/datum-cloud/cloud-portal
    # No explicit secrets block: upstream only uses GITHUB_TOKEN, which is
    # automatically available to reusable workflows.

  # ─── PR Comment ─────────────────────────────────────────────
  pr-comment:
    name: PR Test Summary
    # Must depend on EVERY test job it reports on — otherwise it fires as soon
    # as the fast jobs finish and snapshots the slow ones (the e2e-regression
    # shards) while they're still running, so they show up as "pending" and a
    # real failure would be masked as "pending" too.
    needs: [bun-tests, unit-tests, e2e-smoke, e2e-regression]
    runs-on: ubuntu-latest
    # `always()` so the summary still posts when a test job fails — that's when
    # the artifact links matter most. Without it, a failed dependency would
    # skip this job and leave the PR with no comment at all.
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build test summary
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const runId = context.runId;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });

            const testJobs = jobs.jobs.filter(j =>
              j.name === 'Bun Unit Tests' || j.name === 'Unit Tests' || j.name.startsWith('E2E')
            );

            // A job that hasn't finished has a null `conclusion` (distinct from
            // "skipped"). With this job now depending on every test job it
            // reports on, null should not occur — but label it honestly if it
            // ever does, rather than collapsing it into the "skipped" emoji.
            const statusEmoji = (conclusion) => {
              if (conclusion === 'success') return '✅';
              if (conclusion === 'failure') return '❌';
              if (conclusion === 'cancelled') return '🚫';
              if (conclusion === 'skipped') return '⏭️';
              if (!conclusion) return '⏳';
              return '❓';
            };

            // The e2e jobs retry themselves once (see the `Retry ...` steps).
            // A job whose retry step succeeded is green on the checks page but
            // flaky in reality; say so here so the flake is not lost.
            const passedOnRetry = (job) =>
              (job.steps || []).some(s => s.name.startsWith('Retry ') && s.conclusion === 'success');

            let table = '| Job | Status |\n|-----|--------|\n';
            for (const job of testJobs.sort((a, b) => a.name.localeCompare(b.name))) {
              const flaky = passedOnRetry(job) ? ' ⚠️ passed on retry' : '';
              table += `| ${job.name} | ${statusEmoji(job.conclusion)} ${job.conclusion || 'in progress'}${flaky} |\n`;
            }

            let body = `## 🧪 Test Summary\n\n${table}\n\n`;
            body += `[View workflow run](${runUrl})`;

            const flakyCount = testJobs.filter(passedOnRetry).length;
            if (flakyCount > 0) {
              body += `\n\n⚠️ ${flakyCount} e2e job(s) passed only on retry. That is a flake, not a pass; check the first-attempt screenshots in the artifacts.`;
            }

            body += `\n\n<sub>Need another run? Use **Re-run failed jobs**: one shard costs a few minutes, the whole workflow about 26.</sub>`;

            // Only surface debugging artifacts when a test actually failed. On a
            // green run the coverage/build artifacts still exist, so listing
            // them here would wrongly imply a failure. E2E failure artifacts are
            // named `e2e-*` (see the upload steps); coverage/build are not.
            const anyFailed = testJobs.some(j => j.conclusion === 'failure');
            if (anyFailed) {
              const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
              });
              // Dedupe by name: re-running a failed shard uploads its artifact
              // again under the same name (the name carries run_id but not the
              // run attempt), so the API returns two records for one shard.
              // Keep one row per shard rather than listing the re-run twice.
              const e2eArtifacts = [
                ...new Map(
                  artifacts.artifacts
                    .filter(a => a.name.startsWith('e2e-'))
                    .map(a => [a.name, a])
                ).values(),
              ];
              if (e2eArtifacts.length > 0) {
                body += `\n\n### 📎 Failure artifacts\n\nVideos and screenshots from failed E2E tests:\n\n`;
                for (const a of e2eArtifacts) {
                  body += `- **${a.name}** – [Download](${runUrl})\n`;
                }
              }
            }

            fs.writeFileSync('pr-summary.md', body);

      - uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: pr-summary.md
          edit-mode: replace
