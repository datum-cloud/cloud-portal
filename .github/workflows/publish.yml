name: Publish

# Branch pushes publish branch-named GHCR tags for staging infra pins.
# Tests run via pull_request in ci.yml — not duplicated here.
on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'README.md'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish-container-image:
    name: Publish Container Image
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@a4f8931a5accb27db097a68c06d67802a024a9c5 # v1.23.1
    with:
      image-name: cloud-portal
    # Token goes in as a BuildKit secret only; see the note in ci.yml.
    secrets:
      build-secrets: |
        "sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}"

  publish-kustomize-bundles:
    name: Publish Kustomize Bundles
    needs: [publish-container-image]
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-kustomize-bundle.yaml@a4f8931a5accb27db097a68c06d67802a024a9c5 # v1.23.1
    with:
      bundle-name: ghcr.io/datum-cloud/cloud-portal-kustomize
      bundle-path: config
      image-overlays: config/base
      image-name: ghcr.io/datum-cloud/cloud-portal
