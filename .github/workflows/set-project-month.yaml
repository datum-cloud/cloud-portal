name: Set Project Month

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

# The called workflow authenticates with the project-automation GitHub App
# token and never uses GITHUB_TOKEN, so it gets no scopes.
permissions: {}

jobs:
  set-month:
    uses: datum-cloud/actions/.github/workflows/set-project-month.yaml@5af25b6999a3540391f942c7ea9e61242192b6aa # v1.28.0
    secrets: inherit
