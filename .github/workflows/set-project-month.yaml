name: Set Project Month

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

# The called workflow authenticates with the project-automation GitHub App
# token and never uses GITHUB_TOKEN, so it gets no scopes.
permissions: {}

jobs:
  set-month:
    uses: datum-cloud/actions/.github/workflows/set-project-month.yaml@95a63f871b9cd1f2b4c0224f4a23291beeeb5ef3 # v1.26.0
    secrets: inherit
