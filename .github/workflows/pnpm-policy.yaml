name: pnpm policy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pnpm-policy:
    uses: datum-cloud/actions/.github/workflows/pnpm-policy.yaml@v1.31.0
    with:
      # examples/sample-plugin keeps its own npm lockfile on purpose, so
      # require-pnpm stays off here.
      require-lockfile: true
