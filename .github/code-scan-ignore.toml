# Reviewed exceptions for the shared code scan (datum-cloud/actions code-scan).
# Each entry is one rule on one exact path. Review before renewing.

[[Ignore]]
rule = "process-execution"
path = "app/modules/plugins/server/kubeconfig.ts"
reason = "Runs the kubeconfig exec credential plugin (execFile with a 30s timeout and 1 MiB output cap) to get a bearer token for the plugin dev registry, as kubectl does. The command comes from the operator's own kubeconfig, not from request input."
ignoreUntil = 2027-04-29

[[Ignore]]
rule = "process-execution"
path = "observability/dev-start.js"
reason = "Dev-only launcher: spawns the local Vite binary from node_modules with the current Node (process.execPath) to start the dev server, and forwards signals to it. No external input reaches the command."
ignoreUntil = 2027-04-29

[[Ignore]]
rule = "process-execution"
path = "scripts/graphql.ts"
reason = "Runs `node_modules/@gqlts/cli/dist/cli.js` with the current Node (process.execPath) to generate the GraphQL client for `pnpm graphql`; build-time only, fixed arguments."
ignoreUntil = 2027-04-29

[[Ignore]]
rule = "process-execution"
path = "scripts/lighthouse-authed.mjs"
reason = "Dev tool: spawns a local headless Chrome and `pnpm dlx lighthouse` to audit an authenticated page. Chrome path is the developer's CHROME_PATH or the default macOS location; run manually, never in the app or CI."
ignoreUntil = 2027-04-29
